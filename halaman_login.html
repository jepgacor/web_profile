<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Login</title>
    
</head>
<link   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
>
<style>
body {
    background: linear-grandier(135deg,#667eea,#764ba2)
    min-height: 100vh;
}
.card {
    border:none;
    border-radius: 12px;
}
</style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-4">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h4 class="text-center mb-4">login</h4>
                        <from action="#" method="pots">

                            <!-- email -->
                             <div class="bm-3">
                                <label for="email" class="form-label"></label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="nama@email.com"
                                    reguired
                                    >
                                </div>

                                <!--password-->
                                <div class="bm-3">
                                    <label for="password" class="from-label"></label>
                                    <input
                                        class="from-control"
                                        id="password"
                                        name="password"
                                        placeholder="masukan password"
                                        requeired
                                    >
                                </div>
                                <!--remember me-->
                                <div class="bm-3 from-check"
                                    <input
                                        type="checkbox"
                                        class="from-check-label"for="--remember">
                                        ingat saya
                            </label>
                        </div>

                        <!--tombol login-->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">login</button>
                        </div>
                    </from>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--bootstrap 5 js-->
    <scrip
        src="httml://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
            </script>
        </body>
        </html>
